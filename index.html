<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRX PANEL SHOP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
 min-height:100vh;background:#080e1b;color:white;
 display:flex;align-items:center;justify-content:center;
 padding:25px 15px
}
.container{width:100%;max-width:650px;text-align:center}
.logo{
 width:110px;height:110px;border:3px solid #d6b45e;
 border-radius:28px;margin:0 auto 22px;
 display:grid;place-items:center;color:#e4c36f;
 font-size:36px;font-weight:900;
 box-shadow:0 0 30px #d6b45e35
}
h1{font-size:clamp(27px,5vw,40px);letter-spacing:2px}
h1 span{color:#d6b45e}
.subtitle{color:#9aa6bd;margin:22px 0 45px;font-size:17px}
.card{
 background:#142039;border:2px solid #8c7543;
 border-radius:32px;padding:38px 30px;
 box-shadow:0 15px 50px #0007
}
.heading{
 display:inline-block;border:1px solid #a68a4d;
 color:#e4c36f;border-radius:40px;
 padding:14px 32px;letter-spacing:4px;
 font-weight:bold;margin-bottom:40px
}
.field{text-align:left;margin-bottom:25px}
label{
 display:block;color:#aab5ca;font-size:12px;
 letter-spacing:3px;font-weight:bold;margin-bottom:12px
}
input{
 width:100%;padding:19px;border-radius:15px;
 border:1px solid #35435d;background:#0c1629;
 color:white;font-size:16px;outline:none
}
input:focus{border-color:#d6b45e}
.password{position:relative}
.password input{padding-right:55px}
.eye{
 position:absolute;right:17px;top:50%;
 transform:translateY(-50%);cursor:pointer
}
button{
 width:100%;padding:19px;border:0;border-radius:15px;
 background:linear-gradient(110deg,#e4c36f,#b88b36);
 color:#17130a;font-size:18px;font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.1)}
.switch{margin-top:32px;color:#aab5ca}
.switch span{color:#e4c36f;cursor:pointer;font-weight:bold}
.message{margin-top:18px;color:#e4c36f;line-height:1.5}
.hidden{display:none}
@media(max-width:450px){
 .card{padding:30px 20px}
}
</style>
</head>
<body>
<div class="container">

 <div class="logo">CRX</div>
 <h1>CRX <span>PANEL SHOP</span></h1>
 <p class="subtitle">🔐 Sign in to continue</p>

 <div class="card">
  <div class="heading" id="heading">🔐 SIGN IN</div>

  <form id="authForm">
   <div class="field">
    <label>USERNAME</label>
    <input id="username" placeholder="Enter username" required>
   </div>

   <div class="field hidden" id="emailField">
    <label>EMAIL ADDRESS</label>
    <input id="email" type="email" placeholder="Enter email">
   </div>

   <div class="field">
    <label>PASSWORD</label>
    <div class="password">
     <input id="password" type="password" placeholder="Enter password" required>
     <span class="eye" onclick="togglePassword()">👁️</span>
    </div>
   </div>

   <div class="field hidden" id="confirmField">
    <label>CONFIRM PASSWORD</label>
    <input id="confirm" type="password" placeholder="Confirm password">
   </div>

   <button type="submit" id="submitBtn">🔐 LOG IN →</button>
   <p class="message" id="message"></p>
  </form>

  <p class="switch" id="switch">
   New here? <span onclick="toggleForm()">Create an account</span>
  </p>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</html>
